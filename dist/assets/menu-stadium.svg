<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" fill="none">
<!-- Original stadium illustration for Cadrage Débordement. CC0-1.0. No third-party marks. -->
<defs>
 <linearGradient id="sky" x2="0" y2="850" gradientUnits="userSpaceOnUse"><stop stop-color="#193b43"/><stop offset=".45" stop-color="#677d77"/><stop offset=".7" stop-color="#efaa70"/><stop offset="1" stop-color="#ef7844"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff2c3" stop-opacity=".95"/><stop offset=".15" stop-color="#ffdc9c" stop-opacity=".7"/><stop offset="1" stop-color="#ff9e58" stop-opacity="0"/></radialGradient>
 <linearGradient id="pitch" x1="0" y1="650" x2="0" y2="1200" gradientUnits="userSpaceOnUse"><stop stop-color="#396a43"/><stop offset="1" stop-color="#0a3027"/></linearGradient>
 <linearGradient id="stand" x2="0" y2="1"><stop stop-color="#162d2d"/><stop offset="1" stop-color="#28443c"/></linearGradient>
 <linearGradient id="beam" x2="0" y2="1"><stop stop-color="#fff3d0" stop-opacity=".19"/><stop offset="1" stop-color="#fff3d0" stop-opacity="0"/></linearGradient>
 <pattern id="seats" width="19" height="12" patternUnits="userSpaceOnUse"><path d="M0 8h10M12 8h5" stroke="#9b9f7d" stroke-opacity=".46" stroke-width="3"/><path d="M3 2h5M13 2h4" stroke="#dbbc85" stroke-opacity=".22" stroke-width="2"/></pattern>
 <pattern id="grass" width="100" height="170" patternUnits="userSpaceOnUse"><path fill="#75a55c" fill-opacity=".1" d="M0 0h100v85H0z"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="17"/></filter>
</defs>
<path fill="url(#sky)" d="M0 0h1920v1200H0z"/>
