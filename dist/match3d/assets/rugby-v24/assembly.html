<!doctype html><html lang="fr"><meta charset="utf-8"><title>Lot 24 — qualification d’un joueur habillé</title>
<style>body{margin:0;background:#111b24;color:#eff5f9;font:16px system-ui}header{position:absolute;z-index:2;padding:24px;max-width:580px}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0}button,select{padding:9px;margin:8px 8px 0 0}canvas{display:block}#status{color:#b8d9ba}</style>
<header><h1>Lot 24 · Joueur habillé</h1><p>Assemblage de qualification · sources CC0 · 53 articulations</p><p>Prototype isolé : LOD et gestes rugby en qualification, pas encore intégrés aux 30 joueurs.</p><select id="clip"><option>Chargement…</option></select><button id="front">Face</button><button id="back">Dos</button><button id="side">Profil</button><p id="status">Chargement local des quatre GLB…</p></header>
<script src="../../vendor/three-r149.min.js"></script><script src="../../vendor/GLTFLoader-r149.js"></script><script src="rugby-clips.js"></script><script src="assembly.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111b24);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,50);camera.position.set(3,1.3,4);camera.lookAt(0,.9,0);
scene.add(new THREE.HemisphereLight(0xe0f0ff,0x495749,1.4));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,4,3);scene.add(light);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x263b32,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
let asset,action;window.ready=false;window.failures=[];
function play(name){if(action)action.stop();const clip=asset.clips.find(c=>c.name===name);if(!clip)throw Error(name);action=asset.mixer.clipAction(clip);action.play();asset.mixer.setTime(0);}
const requestedLOD=new URLSearchParams(location.search).get('lod');
const level=requestedLOD===null?null:Number(requestedLOD);
if(level!==null&&![0,1,2].includes(level))throw Error('LOD invalide');
CDV24Assembly.load(THREE,level===null?'../charactercreator-v24/':'lod/',{lod:level===null?undefined:level,rugby:level!==null}).then(a=>{asset=a;scene.add(a.body);window.asset=a;
const select=document.querySelector('#clip');select.innerHTML='';a.clips.forEach(c=>select.add(new Option(c.name,c.name)));select.value='idle';select.onchange=()=>window.setPose(select.value,.25);play('idle');
for(const [id,pos]of Object.entries({front:[0,1,4],back:[0,1,-4],side:[4,1,0]}))document.getElementById(id).onclick=()=>{camera.position.set(...pos);camera.lookAt(0,.9,0);renderer.render(scene,camera);};
camera.position.set(0,1,4);camera.lookAt(0,.9,0);document.querySelector('#status').textContent='4 GLB chargés · rig 53 os · '+a.clips.length+' clips · '+(level===null?'sources':'LOD '+level);renderer.render(scene,camera);window.ready=true;
}).catch(e=>{window.failures.push(String(e));document.querySelector('#status').textContent=String(e);});
window.setPose=(name,time)=>{play(name);asset.mixer.setTime(time);scene.updateMatrixWorld(true);renderer.render(scene,camera);};
renderer.render(scene,camera);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
