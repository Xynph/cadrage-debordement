name: Finances V2 — réception jouable native
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/finance-v2.js'
      - 'dist/finance-v2.css'
      - 'dist/index.html'
      - 'dist/game.js'
      - 'tests/finance-v2-playable.cjs'
      - 'tests/finance-v2-browser.py'
      - '.github/workflows/finance-v2-playable.yml'
jobs:
  native-finance-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of product code and tests
        run: |
          node --check dist/finance-v2.js
          node --check dist/game.js
          node --check tests/finance-v2-playable.cjs
      - name: Native finance actions and save/import regression
        run: node --test tests/finance-v2-playable.cjs tests/career-integration.cjs tests/saves.cjs tests/v51-world-finance.cjs
  chromium-finance-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Open real career, invest, train and reload on PC
        run: python tests/finance-v2-browser.py
      - name: Publish 1920x1080 and 1440x900 screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-v2-playable-chromium
          path: finance-v2-browser-report/
          if-no-files-found: error
          retention-days: 7
