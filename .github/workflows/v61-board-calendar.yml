name: V61 calendrier conseil et objectifs
on:
  # La suite est déjà incluse dans les cinq shards JavaScript complets.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  board:
    if: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, rl27-linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validation V61
        env:
          CD_V61_REPORT: v61-report.json
        run: |
          node --check dist/board-calendar.js
          node tests/v61-board-calendar.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-v61
          path: v61-report.json
          if-no-files-found: ignore
