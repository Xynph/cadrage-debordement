name: V24 progression carriere - 3 5 10 ans
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/development.js'
      - 'tests/v24-career-depth.cjs'
      - '.github/workflows/v24-career-depth.yml'
permissions:
  contents: read
jobs:
  career-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compare annual training cycles and legacy saves
        run: node tests/v24-career-depth.cjs
