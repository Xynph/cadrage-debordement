name: MATCH 3D OSS — real glTF rest TRS with original Ekza IK
on:
  push:
    branches: [research/match3d-oss-audit-ekza-bvh-ik-20261106]
    paths:
      - research/oss-match3d-20261106/extract-real-rest-ik.py
      - research/oss-match3d-20261106/ekza-rest-world.test.ts
      - .github/workflows/match3d-oss-ekza-rest.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-real-rest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CD_EKZA_SHA: b7e3e92f25d2656caace50c0869aeef0d562dbf3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ekza-space/ekza-studio
          ref: b7e3e92f25d2656caace50c0869aeef0d562dbf3
          path: ekza-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d6fbcb38438609c0ca461f54717655223b438b09
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 065589001fbef9641070218b6f85bb597da96a6a
          path: rd-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify upstream exact hash and licensing
        run: |
          test "$(git -C ekza-upstream rev-parse HEAD)" = "$CD_EKZA_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "d6fbcb38438609c0ca461f54717655223b438b09"
          test "$(git -C rd-source rev-parse HEAD)" = "065589001fbef9641070218b6f85bb597da96a6a"
          test -f ekza-upstream/LICENSE
          mkdir -p oss-rest-report
          cp ekza-upstream/LICENSE oss-rest-report/LICENSE-EKZA-MIT.txt
      - name: Read real original GLB TRS and chains
        run: |
          python research/oss-match3d-20261106/extract-real-rest-ik.py baseline rd-source/tools/match3d-v25-lab/remote/lock.json oss-rest-report/real-rest-trs.json
      - name: Call original Ekza solver on actual rest hierarchy and check FK world errors
        run: |
          npm install --global pnpm@10.32.1
          cd ekza-upstream
          pnpm install --frozen-lockfile
          cp ../research/oss-match3d-20261106/ekza-rest-world.test.ts packages/rig/test/cd-rest-ik.test.ts
          export CD_REST_INPUT="$GITHUB_WORKSPACE/oss-rest-report/real-rest-trs.json"
          export CD_REST_OUTPUT="$GITHUB_WORKSPACE/oss-rest-report/real-rest-results.json"
          pnpm --filter @ekza-studio/rig exec vitest run test/cd-rest-ik.test.ts --reporter=verbose
      - name: Fail closed if any of six exact-rest solves is missing
        run: |
          python - <<'PY'
          import json, pathlib, math
          p=pathlib.Path('oss-rest-report/real-rest-results.json')
          assert p.is_file(), 'No native Ekza execution report'
          r=json.loads(p.read_text())
          assert r.get('sourceExecutedDirectly') is True
          a=r.get('results',[])
          assert len(a)==6 and len({(x['lod'],x['side']) for x in a})==6
          assert all(x['reached'] is True and math.isfinite(x['forwardPositionErrorMetres']) and x['forwardPositionErrorMetres']<.003 for x in a)
          print('REAL_EKZA_REST_6_OF_6_PASS')
          PY
      - name: Emit hash manifest always
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('oss-rest-report')
          p.mkdir(exist_ok=True)
          f=[x for x in p.iterdir() if x.is_file() and x.name!='sha256-manifest.json']
          (p/'sha256-manifest.json').write_text(json.dumps([{'name':x.name,'bytes':x.stat().st_size,'sha256':hashlib.sha256(x.read_bytes()).hexdigest()} for x in f],indent=2)+'\n')
          PY
      - name: Upload honest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match3d-oss-ekza-rest-${{ github.sha }}
          path: oss-rest-report/
          retention-days: 14
          if-no-files-found: warn
