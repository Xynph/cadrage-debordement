name: Reception native PC depuis Chat
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tests/v17-native-browser.py'
      - '.github/workflows/chat-native-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: chat-native-qa-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-pc:
    name: Chromium PC — V17 et export historique V16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V17_REPORT_DIR: ${{ github.workspace }}/chat-native-qa-report
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Installer le navigateur du runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Executer le vrai jeu et restaurer un export V16
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python tests/v17-native-browser.py
      - name: Verifier et resumer les preuves du SHA exact
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report_path = Path(os.environ['V17_REPORT_DIR']) / 'report.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Reception native PC\n\nHEAD attendu : `' + os.environ['EXPECTED_HEAD'] + '`\n\n')
              if not report_path.is_file():
                  summary.write('ECHEC : aucun rapport produit. Reception non prouvee.\n')
                  raise SystemExit(1)
              report = json.loads(report_path.read_text())
              exact = report.get('head') == os.environ['EXPECTED_HEAD']
              good = (report.get('passed') is True and exact and
                      not report.get('failures') and not report.get('pageErrors') and
                      bool(report.get('checks')))
              summary.write(('SUCCES' if good else 'ECHEC') + ' : ' + str(len(report.get('checks', []))) + ' controles reussis.\n\n')
              summary.write('Code historique : `' + str(report.get('historicalCommit')) + '`\n\n')
              summary.write('Export V16 SHA-256 : `' + str(report.get('historicalExportSha256')) + '`\n\n')
              summary.write('Rapport JSON, export synthetique et captures dans l’artefact chat-native-qa-report.\n')
              summary.write('Chromium Linux PC ; aucun test Windows natif revendique.\n')
          if not good:
              raise SystemExit(1)
          PY
      - name: Conserver rapport, sauvegarde de test et captures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-native-qa-report
          path: chat-native-qa-report/
          retention-days: 14
          if-no-files-found: error
