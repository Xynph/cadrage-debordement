name: Economy V2 E2.6 atomic evidence sandbox
on:
  pull_request:
    branches:
      - research/economy-v2-e25-due-contract-20261106
    paths:
      - 'dist/economy-v2-atomic-adapter.js'
      - 'tests/economy-v2-atomic-adapter.cjs'
      - 'ci/economy-v2-atomic-run.cjs'
      - '.github/workflows/economy-v2-atomic.yml'
      - 'docs/economie-v2/e26-atomic-adapter.md'
  workflow_dispatch:
jobs:
  native-e26:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [reference, modeste, alternatif]
        seed: [827381, 99173]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/economy-v2-atomic-adapter.js && node --check tests/economy-v2-atomic-adapter.cjs && node --check ci/economy-v2-atomic-run.cjs
      - run: node --test tests/economy-v2-atomic-adapter.cjs tests/economy-v2-due-contract.cjs tests/economy-v2-due-native.cjs tests/economy-v2-obligations.test.cjs tests/economy-v2-debt-audit.test.cjs tests/economy-v2-components.test.cjs tests/economy-v2-shadow.cjs tests/economy-v2-core.cjs
      - run: node ci/economy-v2-atomic-run.cjs ${{ matrix.profile }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e26-${{ matrix.profile }}-${{ matrix.seed }}
          path: economy-v2-e26-reports/
          if-no-files-found: warn
