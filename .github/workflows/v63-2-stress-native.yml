name: V63.2 stress financier natif et checkpoints
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scenarios financiers avec vrais matchs
        env:
          CD_V632_REPORT: v632-financial-stress.json
        run: |
          node --check tests/v63-2-stress-native.cjs
          node tests/v63-2-stress-native.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v632-financial-stress-report
          path: v632-financial-stress.json
          if-no-files-found: ignore
