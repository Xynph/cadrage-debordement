name: Chat release gate (owner only)
on:
  issue_comment:
    types: [created]
permissions: {}
jobs:
  guarded-merge:
    if: >-
      github.repository == 'Xynph/cadrage-debordement' &&
      github.event.issue.number == 73 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.id == 350229047 &&
      github.event.comment.user.login == 'Xynph' &&
      github.event.comment.user.type == 'User' &&
      (startsWith(github.event.comment.body, '/cd-merge ') || startsWith(github.event.comment.body, '/cd-check '))
    permissions:
      contents: write
      pull-requests: read
      actions: write
      issues: write
    concurrency:
      group: chat-release-gate-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Commande autorisée, gate officiel et CI post-fusion exacte
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/chat-release.cjs
