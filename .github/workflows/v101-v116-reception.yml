name: Reception management V101-V116 Chromium PC
# Ménage CI du 12 novembre 2026 : déclenchement automatique retiré (réception Chromium de la version web historique ; tests Node repris par tests.yml, interface web partagée couverte par ui-browser-consolidated.yml).
# Anciens déclencheurs : pull_request, workflow_dispatch. Relance manuelle : Actions > ce workflow > Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  management-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests de contrats metier et syntaxe
        run: |
          node --check tests/v101-v116-reception-browser.mjs
          node tests/v101-v104-espoirs-coaching.cjs
          node tests/v105-v110-sporting-director.cjs
          node tests/v111-v116-fan-experience.cjs
      - name: Installer Chromium pour la reception reelle
        run: |
          npm install --prefix "$RUNNER_TEMP/management-browser" --no-audit --no-fund playwright@1.58.0
          "$RUNNER_TEMP/management-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Parcours Chromium PC, clics, sauvegardes et compatibilite premium
        env:
          CD_PLAYWRIGHT_MODULE: ${{ runner.temp }}/management-browser/node_modules/playwright
        run: node tests/v101-v116-reception-browser.mjs
      - name: Recevoir les captures et preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v101-v116-reception-chromium
          path: v101-v116-reception-report/
          if-no-files-found: error
          retention-days: 14
