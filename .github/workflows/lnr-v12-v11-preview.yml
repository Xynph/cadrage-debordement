name: LNR V12 V11 preview - native contract and saves
# Ménage CI du 12 novembre 2026 : déclenchement automatique retiré (chantier versionné clos, contrôles Node repris par tests.yml).
# Anciens déclencheurs : push, pull_request, workflow_dispatch. Relance manuelle : Actions > ce workflow > Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verifier provenance V11 sans toucher la branche producteur
        uses: actions/checkout@v4
        with:
          ref: b099230c66641f9af06f40101fb67162db40b4b9
          path: .deps/v11
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrats V12 et V11, XV+8, match natif, import/export et anti-double progression
        env:
          CD_V11_ROOT: ${{ github.workspace }}/.deps/v11
        run: node --test tools/lnr-v12-v11-preview/tests.cjs
      - name: Integrite master LNR
        run: |
          echo "Master non modifie par ce workflow"
          git diff --exit-code -- modding/data06/rugby-master-2026-2027.json
