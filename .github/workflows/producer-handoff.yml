name: Passation automatique Producteur vers Integrateur
on:
  pull_request_target:
    types: [ready_for_review]
  workflow_run:
    workflows:
      - Tests JavaScript
      - UI Chromium mutualise - CI V3
      - Carrieres multi-clubs - validation native
      - IA adverse - audit 24 matchs natifs
      - Reception Chromium observatoire tactique
      - Matchday Chromium regroupé
      - Disponibilite et rotation - Chromium
      - LNR-01 - Carriere optionnelle et Chromium
      - LNR-02 - Preuves et rotation sans collecte payante
      - V4.9 Premium finance and academy visual acceptance
      - UI01 - Integration
      - UI02 - Browser
      - V58 manager mobility
      - LNR-05 - evidence browser
    types: [completed]
permissions: {}
concurrency:
  group: cd-producer-handoff-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false
jobs:
  handoff:
    if: github.repository == 'Xynph/cadrage-debordement'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Recevoir seulement les CI exactes et notifier issue 73
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/producer-handoff.cjs
