name: Disponibilite et rotation - Chromium
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/manager-squad.js'
      - 'dist/index.html'
      - 'dist/squad-health-center.*'
      - 'tests/squad-health-center*'
      - '.github/workflows/squad-health-center-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: health-center-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Parcours du centre dans le jeu reel
        run: python tests/squad-health-center-browser.py
