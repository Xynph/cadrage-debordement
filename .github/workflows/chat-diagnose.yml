name: Chat diagnostic serveur (sans Work)
on:
  issue_comment:
    types: [created]
permissions: {}
jobs:
  diagnose:
    if: >-
      github.repository == 'Xynph/cadrage-debordement' &&
      github.event.issue.number == 73 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.id == 350229047 &&
      github.event.comment.user.login == 'Xynph' &&
      github.event.comment.user.type == 'User' &&
      startsWith(github.event.comment.body, '/cd-diagnose ')
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      # Installation limited to this repository; token is revoked automatically at job end.
      # Administration write is required by GitHub to expose bypass_actors; do not
      # grant Contents/Actions/Checks/Issues write to this App.
      - name: Créer le jeton éphémère de lecture complète du ruleset
        id: ruleset-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CD_DIAGNOSTIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.CD_DIAGNOSTIC_APP_PRIVATE_KEY }}
          owner: Xynph
          repositories: cadrage-debordement
          permission-administration: write
      - name: Diagnostic REST en lecture seule et rapport issue 73
        env:
          GH_TOKEN: ${{ github.token }}
          CD_RULESET_TOKEN: ${{ steps.ruleset-token.outputs.token }}
        run: node ci/chat-diagnose.cjs
