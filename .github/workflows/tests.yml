name: Recette visuelle distante PR 504
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v5
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 713492a7fc87efccc65416486e666a038df9b9e2
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Préparer Godot 4.7.2 et les ressources du jeu
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proofs"
          git rev-parse HEAD | tee "$RUNNER_TEMP/proofs/source.txt"
          test "$(git rev-parse HEAD)" = 713492a7fc87efccc65416486e666a038df9b9e2
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          godot="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$godot" --version
          command -v xvfb-run || (sudo apt-get update -qq && sudo apt-get install -y xvfb xauth)
          python scripts/build-godot-prototype.py --stage-only --node "$(command -v node)"
          "$godot" --headless --path native/godot --import >"$RUNNER_TEMP/proofs/import.log" 2>&1 || { tail -100 "$RUNNER_TEMP/proofs/import.log"; exit 1; }
          ! grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/proofs/import.log"
      - name: Contrôler la presse et le calendrier aux deux définitions
        run: |
          set -uo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          export CD_NODE_EXECUTABLE="$(command -v node)"
          export CD_GODOT_GUIDE_MODULE_TEST=1
          godot="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          failed=0
          for dimensions in 1920x1080 2560x1440; do
            export QA_RESOLUTION="$dimensions"
            export QA_OUTPUT="$RUNNER_TEMP/proofs/$dimensions"
            export CD_GODOT_DATA_DIR="$RUNNER_TEMP/profile-$dimensions"
            export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data-$dimensions"
            export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config-$dimensions"
            mkdir -p "$QA_OUTPUT"
            if ! timeout 105s xvfb-run -a -s "-screen 0 $dimensions"'x24' "$godot" --display-driver x11 --audio-driver Dummy --windowed --resolution "$dimensions" --max-fps 60 --path native/godot --script "$GITHUB_WORKSPACE/qa/ci/cloud-visual-pr504.gd" 2>&1 | tee "$QA_OUTPUT/godot.log"; then
              failed=1
            fi
            if grep -Eq 'SCRIPT ERROR|Parse Error' "$QA_OUTPUT/godot.log"; then failed=1; fi
          done
          exit "$failed"
      - name: Publier les preuves visuelles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oval-legacy-pr504-visual
          path: ${{ runner.temp }}/proofs/
          retention-days: 2
          if-no-files-found: error
