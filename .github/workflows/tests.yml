name: Recette Godot distante de la Réception
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v5
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 0210d840e093afaa6caf454aa8aad8153d7559f9
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Préparer Godot 4.7.2 et les ressources du jeu
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proofs"
          git rev-parse HEAD | tee "$RUNNER_TEMP/proofs/source.txt"
          test "$(git rev-parse HEAD)" = 0210d840e093afaa6caf454aa8aad8153d7559f9
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          godot="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$godot" --version
          command -v xvfb-run || (sudo apt-get update -qq && sudo apt-get install -y xvfb xauth)
          python scripts/build-godot-prototype.py --stage-only --node "$(command -v node)"
          "$godot" --headless --path native/godot --import >"$RUNNER_TEMP/proofs/import.log" 2>&1 || { tail -100 "$RUNNER_TEMP/proofs/import.log"; exit 1; }
          ! grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/proofs/import.log"
      - name: Vérifier la Réception et les sélections en Godot
        run: |
          set -euo pipefail
          export CD_NODE_EXECUTABLE="$(command -v node)"
          export CD_GODOT_EXECUTABLE="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          export CD_GODOT_EXE="$CD_GODOT_EXECUTABLE"
          export CD_GODOT_GUIDE_MODULE_TEST=1
          export CD_GODOT_DATA_DIR="$RUNNER_TEMP/profile-hub"
          timeout 60s "$CD_GODOT_EXECUTABLE" --headless --path native/godot --script "$GITHUB_WORKSPACE/source/tests/godot-reception-hub.gd" 2>&1 | tee "$RUNNER_TEMP/proofs/hub.log"
          ! grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/proofs/hub.log"
      - name: Vérifier les recettes historiques
        if: always()
        run: |
          set -euo pipefail
          export CD_GODOT_EXECUTABLE="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          export CD_GODOT_EXE="$CD_GODOT_EXECUTABLE"
          export CD_GODOT_GUIDE_MODULE_TEST=1
          node --test tests/native-press-ui.cjs tests/godot-review-regressions.cjs tests/godot-immersive-reception.cjs 2>&1 | tee "$RUNNER_TEMP/proofs/regressions.log"
      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oval-legacy-reception-hub
          path: ${{ runner.temp }}/proofs/
          retention-days: 2
          if-no-files-found: error
