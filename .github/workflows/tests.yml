name: Tests JavaScript
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  classification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coverage: ${{ steps.diff.outputs.coverage }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - id: diff
        name: Classifier le changement et vérifier la syntaxe JS modifiée
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: node ci/test-coverage.cjs

  shards:
    name: Suites ${{ matrix.shard }}/5
    needs: classification
    if: ${{ needs.classification.result == 'success' && needs.classification.outputs.coverage != 'documentation' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    # Le précédent shard long a atteint 20 min ; mêmes cinq groupes complets.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Tests du jeu et bilan des erreurs
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          COVERAGE: ${{ needs.classification.outputs.coverage }}
        run: |
          set -euo pipefail
          node ci/shard-tests.cjs "$SHARD" "$COVERAGE" > "$RUNNER_TEMP/shard-suites.txt"
          mapfile -t suites < "$RUNNER_TEMP/shard-suites.txt"
          total="$(find tests -maxdepth 1 -name '*.cjs' ! -name 'harness.cjs' | wc -l)"
          [[ "${#suites[@]}" -gt 0 ]] || exit 1
          failures=0
          executed=0
          for test in "${suites[@]}"; do
            executed=$((executed+1))
            echo "::group::$test"
            start=$SECONDS
            limit=180s
            # Rendez-vous réels : décisions et clôtures gardent leurs transactions.
            # PASS locaux complets du 10 novembre : monde 325 s, manager 173 s,
            # académie 342 s ; staff + rendez-vous combinés : délégation 159 s,
            # support saison 171 s. Marges ciblées pour GitHub Node 22.
            case "$test" in
              tests/world-worker-season.cjs) limit=420s ;;
              tests/native-manager-career-worker.cjs) limit=240s ;;
              tests/native-academy-integrated-long.cjs) limit=480s ;;
              tests/native-delegate-transaction06.cjs) limit=240s ;;
              tests/native-club-support-season.cjs) limit=240s ;;
            esac
            if timeout --signal=TERM --kill-after=10s "$limit" /usr/bin/time -f "CD_CPU_PROFILE suite=$test user_s=%U system_s=%S wall_s=%e cpu_pct=%P max_rss_kb=%M" node "$test"; then
              echo "PASS $test ($((SECONDS-start)) s)"
              echo "| $test | OK | $((SECONDS-start)) s |" >> "$RUNNER_TEMP/results.md"
            else
              code=$?
              failures=$((failures+1))
              echo "::error file=$test::Échec ou délai dépassé (code $code, durée $((SECONDS-start)) s, limite $limit)"
              echo "| $test | ECHEC ($code) | $((SECONDS-start)) s |" >> "$RUNNER_TEMP/results.md"
            fi
            echo "::endgroup::"
          done
          {
            echo "### Shard $SHARD/5 ($COVERAGE) : $executed suites sur $total"
            echo "| Suite | Résultat | Durée |"
            echo "| --- | --- | --- |"
            cat "$RUNNER_TEMP/results.md"
            echo ""
            echo "**Échecs : $failures**"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$failures" -eq 0 ]]
  validation:
    name: Validation CI
    if: ${{ always() }}
    needs: [classification, shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publier le verdict natif (sans écriture API)
        shell: bash
        env:
          CLASSIFICATION: ${{ needs.classification.result }}
          COVERAGE: ${{ needs.classification.outputs.coverage }}
          SHARDS: ${{ needs.shards.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          result='ÉCHEC'
          if [[ "$CLASSIFICATION" == "success" ]]; then
            case "$EVENT_NAME:$COVERAGE:$SHARDS" in
              pull_request:documentation:skipped|pull_request:web:success|pull_request:native-art:success|\
              pull_request:full:success|push:full:success|workflow_dispatch:full:success)
                result='SUCCÈS' ;;
            esac
          fi
          url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "## Verdict CI : $result"
            echo ""
            echo "- HEAD associé au contrôle : \`$HEAD_SHA\`"
            echo "- Commit testé : \`$GITHUB_SHA\`"
            echo "- Événement : $EVENT_NAME"
            echo "- Classification : $CLASSIFICATION"
            echo "- Suites : $SHARDS"
            echo "- Couverture : $COVERAGE"
            echo "- [Voir les contrôles et les erreurs]($url)"
            echo ""
            echo "Ce résumé est informatif : seule la conclusion du contrôle Validation CI autorise la décision de fusion."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Verdict CI::$result sur $HEAD_SHA - $url"
          [[ "$result" == "SUCCÈS" ]]
