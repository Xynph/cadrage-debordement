name: Recette visuelle distante Sélections et Réception
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - dimensions: 1920x1080
            scenarios: match
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v5
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: f7c39ed23722d364d5d33fbdbff2b64444158f87
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Préparer Godot 4.7.2 et les ressources du jeu
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proofs"
          git rev-parse HEAD | tee "$RUNNER_TEMP/proofs/source.txt"
          test "$(git rev-parse HEAD)" = f7c39ed23722d364d5d33fbdbff2b64444158f87
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          godot="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$godot" --version
          command -v xvfb-run || (sudo apt-get update -qq && sudo apt-get install -y xvfb xauth)
          python scripts/build-godot-prototype.py --stage-only --node "$(command -v node)"
          "$godot" --headless --path native/godot --import >"$RUNNER_TEMP/proofs/import.log" 2>&1 || { tail -100 "$RUNNER_TEMP/proofs/import.log"; exit 1; }
          ! grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/proofs/import.log"
      - name: Préparer le profil du jour de France–Fidji
        if: matrix.scenarios == 'match'
        run: |
          set -euo pipefail
          timeout 650s node "$GITHUB_WORKSPACE/qa/ci/cloud-visual-seed-match.cjs" "$RUNNER_TEMP/profile-match" 2>&1 | tee "$RUNNER_TEMP/proofs/seed-match.log"
      - name: Recevoir les parcours Godot rendus
        env:
          QA_RESOLUTION: ${{ matrix.dimensions }}
          QA_SCENARIOS: ${{ matrix.scenarios }}
        run: |
          set -uo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          export CD_NODE_EXECUTABLE="$(command -v node)"
          export CD_GODOT_GUIDE_MODULE_TEST=1
          export CD_GODOT_SEED=713492
          godot="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          failed=0
          for scenario in $QA_SCENARIOS; do
            export QA_SCENARIO="$scenario"
            export QA_OUTPUT="$RUNNER_TEMP/proofs/$QA_RESOLUTION/$scenario"
            export CD_GODOT_DATA_DIR="$RUNNER_TEMP/profile-$scenario"
            export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data-$scenario"
            export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config-$scenario"
            mkdir -p "$QA_OUTPUT"
            if ! timeout 115s xvfb-run -a -s "-screen 0 ${QA_RESOLUTION}x24" "$godot" --display-driver x11 --audio-driver Dummy --windowed --resolution "$QA_RESOLUTION" --max-fps 60 --path native/godot --script "$GITHUB_WORKSPACE/qa/ci/cloud-visual-reception.gd" 2>&1 | tee "$QA_OUTPUT/godot.log"; then
              failed=1
            fi
            if grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' "$QA_OUTPUT/godot.log"; then failed=1; fi
          done
          exit "$failed"
      - name: Publier les captures et rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oval-legacy-${{ matrix.dimensions }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/proofs/
          retention-days: 2
          if-no-files-found: error
