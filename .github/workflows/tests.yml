name: Tests JavaScript
on:
  pull_request:
    branches: [main]
    # ready_for_review : la batterie complète part au passage d'un brouillon en prête.
    # Sur un brouillon, seuls la classification (syntaxe JS modifiée) et le verdict
    # tournent : « Validation CI » reste rouge tant que les suites n'ont pas tourné.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR : seul le dernier push compte. main : seul le dernier commit fusionné compte (chaque
# PR a déjà passé la batterie complète) ; workflow_dispatch n'est jamais annulé.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  classification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      coverage: ${{ steps.diff.outputs.coverage }}
      draft: ${{ github.event.pull_request.draft == true }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - id: diff
        name: Classifier le changement et vérifier la syntaxe JS modifiée
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: node ci/test-coverage.cjs

  shards:
    name: Suites ${{ matrix.shard }}/7
    needs: classification
    if: ${{ needs.classification.result == 'success' && needs.classification.outputs.coverage != 'documentation' && needs.classification.outputs.draft != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    # Sept lots équilibrés (ci/shard-tests.cjs, poids ci/suite-weights.json), toutes
    # les suites conservées, trois au plus par runner (deux dès qu'une suite exclusive
    # tourne : 2 cœurs physiques) sous budget mémoire.
    # Nombre de shards et parallélisme : ci/ci-jobs.cjs (SHARD_COUNT, SHARD_PARALLEL).
    # Marge globale finie ; chaque suite garde aussi son propre délai maximal.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Tests du jeu et bilan des erreurs
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          COVERAGE: ${{ needs.classification.outputs.coverage }}
        run: |
          set -euo pipefail
          node ci/shard-tests.cjs "$SHARD" "$COVERAGE" 7 > "$RUNNER_TEMP/shard-suites.txt"
          mapfile -t suites < "$RUNNER_TEMP/shard-suites.txt"
          if [[ "${#suites[@]}" -eq 0 ]]; then
            # Couverture ciblée (web, native-art) : moins de suites que de shards.
            # En couverture complète, un shard vide est une erreur de planification.
            [[ "$COVERAGE" != full ]] || exit 1
            echo "### Shard $SHARD/7 ($COVERAGE) : aucune suite attribuée" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Trois suites au plus (4 vCPU = 2 cœurs physiques) : deux dès qu'une suite
          # exclusive (longue ou machine virtuelle à délai interne) tourne ; budget mémoire
          # de 12 Go. Budgets par suite, journaux groupés et résumé : ci/run-shard-suites.sh.
          bash ci/run-shard-suites.sh "$RUNNER_TEMP/shard-suites.txt" "Shard $SHARD/7 ($COVERAGE)" 3
  godot:
    name: Godot ${{ matrix.shard }}/3
    needs: classification
    # Suites qui pilotent le SDK (source lisant CD_GODOT_EXE ou CD_GODOT_EXECUTABLE).
    # NON BLOQUANT pour commencer : hors des dépendances de « Validation CI » et
    # continue-on-error, tant que ces suites ne sont pas fiables et rapides en CI.
    if: ${{ needs.classification.result == 'success' && needs.classification.outputs.draft != 'true' && (needs.classification.outputs.coverage == 'full' || needs.classification.outputs.coverage == 'native-art') }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      # Version exacte épinglée : archive officielle godotengine/godot-builds, somme
      # SHA-256 vérifiée à chaque exécution (y compris depuis le cache). Concorde avec
      # SHA512-SUMS.txt de la release : 9aa00f7a…ed54c65.
      GODOT_VERSION: 4.7.2-stable
      GODOT_ZIP: Godot_v4.7.2-stable_linux.x86_64.zip
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Cache de l'archive Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/cd-godot
          key: godot-4.7.2-stable-linux-x86_64-cadd3204e728a35d
      - name: Installer Godot 4.7.2 (SHA-256 vérifiée)
        shell: bash
        run: |
          set -euo pipefail
          archive="$HOME/.cache/cd-godot/$GODOT_ZIP"
          mkdir -p "$(dirname "$archive")"
          if [[ ! -f "$archive" ]]; then
            curl -fsSL --retry 3 --retry-delay 5 -o "$archive.part" \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/$GODOT_ZIP"
            mv "$archive.part" "$archive"
          fi
          if ! echo "$GODOT_SHA256  $archive" | sha256sum -c -; then
            rm -f "$archive"
            echo "::error::Somme SHA-256 de Godot invalide"
            exit 1
          fi
          unzip -q -o "$archive" -d "$RUNNER_TEMP/godot"
          exe="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$exe"
          echo "CD_GODOT_EXECUTABLE=$exe" >> "$GITHUB_ENV"
          echo "CD_GODOT_EXE=$exe" >> "$GITHUB_ENV"
      - name: Serveur X virtuel et rendu logiciel Mesa
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth libgl1 libgl1-mesa-dri \
            libglx-mesa0 libegl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1
          node ci/godot-env.cjs --check
      - name: Cache des imports Godot
        uses: actions/cache@v4
        with:
          path: |
            native/godot/.godot
            native/godot/**/*.import
            native/godot/**/*.uid
          key: godot-import-4.7.2-${{ hashFiles('native/godot/**') }}
          restore-keys: godot-import-4.7.2-
      - name: Préparer le projet Godot (staging des ressources)
        shell: bash
        # Comme en local : registres anonymisés, photos, portraits et modèle CC0 copiés
        # dans native/godot/assets (ignoré par Git), requis par les suites natives.
        run: python3 scripts/build-godot-prototype.py --stage-only --node "$(command -v node)"
      - name: Importer le projet Godot
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          timeout 900 "$CD_GODOT_EXECUTABLE" --headless --editor --import --path native/godot \
            > "$RUNNER_TEMP/godot-import.log" 2>&1 || { tail -50 "$RUNNER_TEMP/godot-import.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/godot-import.log"
          echo "Import Godot : $((SECONDS-start)) s"
      - name: Suites Godot (SDK obligatoire, xvfb, rendu logiciel)
        shell: bash
        # Délai d'étape (échec) plus court que celui du job (annulation) : un
        # dépassement ne doit pas faire passer le run entier à « cancelled ».
        timeout-minutes: 45
        env:
          SHARD: ${{ matrix.shard }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          node ci/shard-tests.cjs "$SHARD" godot 3 > "$RUNNER_TEMP/godot-suites.txt"
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            bash ci/run-godot-suites.sh "$RUNNER_TEMP/godot-suites.txt" "Godot $SHARD/3"
  validation:
    name: Validation CI
    if: ${{ always() }}
    needs: [classification, shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publier le verdict natif (sans écriture API)
        shell: bash
        env:
          CLASSIFICATION: ${{ needs.classification.result }}
          COVERAGE: ${{ needs.classification.outputs.coverage }}
          SHARDS: ${{ needs.shards.result }}
          DRAFT: ${{ needs.classification.outputs.draft }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          result='ÉCHEC'
          # Brouillon : la batterie complète n'a pas tourné, verdict jamais vert (sauf PR
          # purement documentaire, qui n'a aucune suite à lancer). Passer la PR en prête.
          draft_wait=''
          if [[ "${DRAFT:-false}" == "true" && "$COVERAGE" != "documentation" ]]; then
            draft_wait='Brouillon : batterie complète non lancée, passer la PR en prête pour la lancer'
          elif [[ "$CLASSIFICATION" == "success" ]]; then
            case "$EVENT_NAME:$COVERAGE:$SHARDS" in
              pull_request:documentation:skipped|pull_request:web:success|pull_request:native-art:success|\
              pull_request:full:success|push:full:success|workflow_dispatch:full:success)
                result='SUCCÈS' ;;
            esac
          fi
          url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "## Verdict CI : $result"
            echo ""
            echo "- HEAD associé au contrôle : \`$HEAD_SHA\`"
            echo "- Commit testé : \`$GITHUB_SHA\`"
            echo "- Événement : $EVENT_NAME"
            echo "- Classification : $CLASSIFICATION"
            echo "- Suites : $SHARDS"
            echo "- Couverture : $COVERAGE"
            if [[ -n "$draft_wait" ]]; then echo "- $draft_wait"; fi
            echo "- [Voir les contrôles et les erreurs]($url)"
            echo ""
            echo "Ce résumé est informatif : seule la conclusion du contrôle Validation CI autorise la décision de fusion."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$draft_wait" ]]; then echo "::warning title=Brouillon::$draft_wait"; fi
          echo "::notice title=Verdict CI::$result sur $HEAD_SHA - $url"
          [[ "$result" == "SUCCÈS" ]]
