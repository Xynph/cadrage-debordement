name: UI01 integration review
# Réceptions PR et push assurées par ui-browser-consolidated.yml.
# Le job historique reste disponible en workflow_dispatch pour diagnostic.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui01-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Eviter les receptions Chromium obsoletes apres un nouveau commit de PR.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Suites natives deja couvertes par Tests JavaScript : seulement reception Chromium ici.
  browser:
    name: UI01 Chromium acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual game navigation, contrast and screenshots
        run: |
          python tests/ui01-browser.py
          python tests/ui01-contrast.py
          python tests/main-menu-v3-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui01-browser-report
          path: ui01-browser-report/
          retention-days: 7
          if-no-files-found: error
