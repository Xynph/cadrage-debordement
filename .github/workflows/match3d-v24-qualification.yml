name: MATCH 3D v24 - qualification LOD et gestes
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/match3d/assets/rugby-v24/**'
      - 'tests/match3d-v24-lod-browser.py'
      - '.github/workflows/match3d-v24-qualification.yml'
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Chromium hors ligne
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Recevoir trois LOD et quatre gestes rugby
        run: python tests/match3d-v24-lod-browser.py
      - name: Publier les captures et resultats, meme en cas d'erreur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match3d-v24-lod-browser-report
          path: match3d-v24-lod-report/
          if-no-files-found: warn
