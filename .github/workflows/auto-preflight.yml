name: Précontrôle automatique des PR ordinaires (lecture seule)
on:
  workflow_run:
    workflows: ['Tests JavaScript']
    types: [completed]

permissions: {}

jobs:
  preflight:
    if: >-
      github.repository == 'Xynph/cadrage-debordement' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      # Toujours du code de main, jamais d'une PR non fiable.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Vérifier le précontrôle lui-même
        run: node tests/auto-preflight.cjs
      - name: Résumé des PR prêtes sans aucune fusion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: node ci/auto-preflight.cjs
