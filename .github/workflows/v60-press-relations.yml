name: V60 relations presse hors match
on:
  # La suite est déjà incluse dans les cinq shards JavaScript complets.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  press-relations:
    if: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, rl27-linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validation moteur et quinze saisons
        env:
          CD_V60_REPORT: v60-report.json
        run: |
          node --check dist/press-relations.js
          node --check tests/v60-press-relations.cjs
          node tests/v60-press-relations.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-presse-v60
          path: v60-report.json
          if-no-files-found: ignore
