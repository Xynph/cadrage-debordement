name: Rugby Reel - potential and age V13 QA
on:
  pull_request:
    paths:
      - 'data/scouting/audit-potential-v13-20261107.json'
      - 'docs/rugby-real-potential-age-v13-20261107.md'
      - 'tests/rugby-real-potential-age-v13-20261107.cjs'
      - '.github/workflows/rugby-real-potential-age-v13.yml'
  workflow_dispatch:
jobs:
  potential-and-age:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate potential scales and 11 age curves
        run: node --test tests/rugby-real-potential-age-v13-20261107.cjs
