name: LNR-02 - Preuves et rotation sans collecte payante
# Ménage CI du 12 novembre 2026 : déclenchement automatique retiré (réception Chromium de la version web historique ; tests Node repris par tests.yml, interface web partagée couverte par ui-browser-consolidated.yml).
# Anciens déclencheurs : pull_request, workflow_dispatch. Relance manuelle : Actions > ce workflow > Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lnr02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  node:
    # Tests Node ordinaires déjà exécutés dans le shard complet CI sur chaque PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Vérifier identité, composition, anciennes carrières
        run: |
          node --check dist/lnr05-enriched-data.js
          node --check dist/lnr05-evidence-center.js
          node --check dist/game.js
          node tests/lnr05-evidence.cjs
          node tests/lnr05-matchday-advice.cjs
          node tests/lnr05-matchday-decision.cjs
          node tests/lnr05-rotation-audit.cjs
          node tests/lnr05-fatigue-scenarios.cjs
          node tests/lnr05-physical-propagation.cjs
          node tests/lnr05-multiseason-strategies.cjs
          node tests/lnr05-match-simulation-propagation.cjs
          node tests/lnr05-evidence-long.cjs
  longitudinal-audit:
    name: "Audit 4 saisons / ${{ matrix.mode }} / graine ${{ matrix.seed }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [temoin, rotation, repos, combine]
        seed: [0, 29]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Mesurer quatre saisons et sauvegardes
        env:
          LNR_AUDIT_MODE: ${{ matrix.mode }}
          LNR_AUDIT_SEED: ${{ matrix.seed }}
        run: node tests/lnr05-multiseason-strategies.cjs
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Tester la cellule de preuves dans le jeu
        run: python tests/lnr05-evidence-browser.py
