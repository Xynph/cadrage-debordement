name: LNR-02 - Preuves et rotation sans collecte payante
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/lnr05-*'
      - 'dist/game.js'
      - 'dist/index.html'
      - 'tests/lnr05-*'
      - 'docs/lnr05-evidence.md'
      - '.github/workflows/lnr05-evidence-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lnr02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Vérifier identité, composition, anciennes carrières
        run: |
          node --check dist/lnr05-enriched-data.js
          node --check dist/lnr05-evidence-center.js
          node --check dist/game.js
          node tests/lnr05-evidence.cjs
          node tests/lnr05-matchday-advice.cjs
          node tests/lnr05-matchday-decision.cjs
          node tests/lnr05-rotation-audit.cjs
          node tests/lnr05-fatigue-scenarios.cjs
          node tests/lnr05-physical-propagation.cjs
          node tests/lnr05-evidence-long.cjs
  real-import-no-network:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Import effectif réel des 240 profils, zéro réseau zéro crédit
        run: node --test tests/lnr05-real-import.cjs
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Tester la cellule de preuves dans le jeu
        run: python tests/lnr05-evidence-browser.py
