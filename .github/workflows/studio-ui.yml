name: Studio UI Premium PC
on:
  push:
    branches: [feature/studio-ui-premium-toolchain-20261106]
    paths: ['studio-ui/**', '.github/workflows/studio-ui.yml']
  pull_request:
    paths: ['studio-ui/**', '.github/workflows/studio-ui.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  studio-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: studio-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dépendances
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Initialisation réelle shadcn et verrouillage npm sur branche isolée
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/studio-ui-premium-toolchain-20261106'
        run: |
          if [ ! -f package-lock.json ]; then
            npx --yes shadcn@latest init --yes
            npx --yes shadcn@latest add badge --yes
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- .
            if ! git diff --cached --quiet; then
              git commit -m "chore(studio-ui): finalize shadcn CLI and lock npm dependencies"
              git push origin HEAD:feature/studio-ui-premium-toolchain-20261106
            fi
          fi
      - name: Vérification TypeScript
        run: npm run check
      - name: Construction Vite
        run: npm run build
      - name: Construction Storybook
        run: npm run build-storybook
      - name: Chromium
        run: npx playwright install chromium
      - name: Tests visuels PC
        run: npm run test:e2e
      - name: Captures et rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-ui-artifacts
          path: |
            studio-ui/test-results/
            studio-ui/playwright-report/
          if-no-files-found: ignore
