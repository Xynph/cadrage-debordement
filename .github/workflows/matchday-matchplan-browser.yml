name: Poste de decision MATCHDAY-03 - Chromium
on:
  pull_request:
    branches: [main, integration/matchday02-lineup-advisor]
    paths:
      - 'dist/index.html'
      - 'dist/matchday-center.js'
      - 'dist/matchday-matchplan.*'
      - 'tests/matchday-matchplan*'
      - '.github/workflows/matchday-matchplan-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matchday03-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Vérifier les scénarios et les sauvegardes
        run: |
          node --check dist/matchday-matchplan.js
          node tests/matchday-lineup.cjs
          node tests/matchday-matchplan.cjs
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Essayer trois scénarios tactiques et de sélection
        run: python tests/matchday-matchplan-browser.py
