name: Pilotage de saison - Chromium
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/manager.js'
      - 'tests/manager-season-pilotage*'
      - '.github/workflows/manager-season-pilotage-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manager-pilotage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Chromium Playwright
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Tester le panneau sur le jeu réel
        run: python tests/manager-season-pilotage-browser.py
