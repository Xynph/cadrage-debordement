name: Fusion ordinaire contrôlée
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Numéro de PR
        type: string
        required: true
      sha:
        description: SHA HEAD complet de la PR
        type: string
        required: true
      mode:
        description: Contrôler ou fusionner cette tête
        type: choice
        options: [check, merge]
        default: check
        required: true

permissions: {}

jobs:
  check:
    if: >-
      github.repository == 'Xynph/cadrage-debordement' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Xynph' &&
      github.actor_id == '350229047' &&
      github.triggering_actor == 'Xynph' &&
      github.event.sender.id == 350229047 &&
      github.run_attempt == 1 &&
      inputs.mode == 'check'
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Contrôler la PR sélectionnée en lecture seule
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/auto-release.cjs

  merge:
    if: >-
      github.repository == 'Xynph/cadrage-debordement' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Xynph' &&
      github.actor_id == '350229047' &&
      github.triggering_actor == 'Xynph' &&
      github.event.sender.id == 350229047 &&
      github.run_attempt == 1 &&
      inputs.mode == 'merge' &&
      vars.CD_ORDINARY_MERGE_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: read
      actions: write
    concurrency:
      group: chat-release-gate-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Fusionner par le gate officiel et vérifier la CI de main
        env:
          GH_TOKEN: ${{ github.token }}
          CD_ORDINARY_MERGE_ENABLED: ${{ vars.CD_ORDINARY_MERGE_ENABLED }}
        run: node ci/auto-release.cjs
