name: Economy V2 E3.4 native investment decisions (advisory only)
on:
  pull_request:
    branches:
      - research/economy-v2-e33-investment-evidence-20261106
    paths:
      - '.github/workflows/economy-v2-e34.yml'
      - 'ci/economy-v2-e34-advisor.cjs'
      - 'ci/economy-v2-e34-run.cjs'
      - 'tests/economy-v2-e34-advisor.cjs'
      - 'docs/economie-v2/e34-advisor.md'
  workflow_dispatch:
jobs:
  native-e34:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        profile: [reference, modeste, alternatif]
        seed: [827381, 99173]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and relevant native tests
        run: |
          node --check ci/economy-v2-e34-advisor.cjs
          node --check ci/economy-v2-e34-run.cjs
          node --check tests/economy-v2-e34-advisor.cjs
          node --test tests/economy-v2-e34-advisor.cjs tests/economy-v2-e33-investments.cjs tests/economy-v2-e32-adapter.cjs tests/economy-v2-e31-pc.cjs tests/economy-v2-e30-playability.cjs
      - name: Fifteen native seasons and save-state/checksum parity
        run: node ci/economy-v2-e34-run.cjs ${{ matrix.profile }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e34-${{ matrix.profile }}-${{ matrix.seed }}
          path: economy-v2-e34-reports/
          if-no-files-found: error
