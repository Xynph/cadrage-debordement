name: UI02 live browser acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/index.html'
      - 'dist/manager-squad.js'
      - 'dist/ui02-*.js'
      - 'dist/ui02-*.css'
      - 'tests/ui02-*'
      - '.github/workflows/ui02-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui02-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  chromium:
    name: UI02 Chromium live game
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Playwright fixé
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Vérifier le jeu réel en Chromium
        run: python tests/ui02-live-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui02-live-browser-report
          path: ui02-browser-report/
          retention-days: 7
