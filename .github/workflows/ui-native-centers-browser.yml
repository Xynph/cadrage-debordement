name: Centres recrutement et formation - Chromium
# Réceptions PR et push assurées par ui-browser-consolidated.yml.
# Le job historique reste disponible en workflow_dispatch pour diagnostic.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-centers-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    name: Recrutement et formation - jeu réel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Chromium de test
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Vérifier les deux centres jouables
        run: python tests/ui-native-centers-browser.py
