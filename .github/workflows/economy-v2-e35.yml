name: Economy V2 E3.5 native paired sports outcomes
on:
  pull_request:
    branches:
      - research/economy-v2-e34-decision-advisor-20261106
    paths:
      - '.github/workflows/economy-v2-e35.yml'
      - 'ci/economy-v2-e35-counterfactual.cjs'
      - 'ci/economy-v2-e35-run.cjs'
      - 'tests/economy-v2-e35-counterfactual.cjs'
      - 'docs/economie-v2/e35-counterfactual.md'
  workflow_dispatch:
jobs:
  native-e35:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        profile: [reference, modeste, alternatif]
        seed: [827381, 99173]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native syntax and paired tests
        run: |
          node --check ci/economy-v2-e35-counterfactual.cjs
          node --check ci/economy-v2-e35-run.cjs
          node --check tests/economy-v2-e35-counterfactual.cjs
          node --test tests/economy-v2-e35-counterfactual.cjs tests/economy-v2-e34-advisor.cjs tests/economy-v2-e33-investments.cjs
      - name: Paired-native probes plus 15-season original game parity
        run: node ci/economy-v2-e35-run.cjs ${{ matrix.profile }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e35-${{ matrix.profile }}-${{ matrix.seed }}
          path: economy-v2-e35-reports/
          if-no-files-found: error
