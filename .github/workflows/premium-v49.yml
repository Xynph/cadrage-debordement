name: V4.9 Premium finance and academy visual acceptance
on:
  pull_request:
    paths:
      - 'dist/index.html'
      - 'dist/premium-v49.css'
      - 'tests/premium-v49-browser.py'
      - '.github/workflows/premium-v49.yml'
  workflow_dispatch:
jobs:
  chromium-v49:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Run real native finance/academy views
        run: python tests/premium-v49-browser.py
      - name: Publish visual and save regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-v49-browser-report
          path: ui01-browser-report/premium-v49/
          if-no-files-found: error
          retention-days: 7
