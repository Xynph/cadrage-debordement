name: Economy V2 E2.3 debt and PC cockpit
on:
  pull_request:
    branches:
      - research/economy-v2-e22-components-20261106
    paths:
      - 'tests/economy-v2-debt-audit.cjs'
      - 'tests/economy-v2-debt-audit.test.cjs'
      - 'ci/economy-v2-debt-cockpit-run.cjs'
      - 'ci/economy-v2-cockpit-render.cjs'
      - 'tests/economy-v2-cockpit-chromium.py'
      - '.github/workflows/economy-v2-debt-cockpit.yml'
      - 'docs/economie-v2/e23-debt-cockpit.md'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [reference, modeste, alternatif]
        seed: [827381, 99173]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/economy-v2-debt-audit.cjs && node --check ci/economy-v2-debt-cockpit-run.cjs && node --check ci/economy-v2-cockpit-render.cjs
      - run: node --test tests/economy-v2-debt-audit.test.cjs tests/economy-v2-components.test.cjs tests/economy-v2-shadow.cjs tests/economy-v2-core.cjs
      - run: node tests/economy-v2-cash-trace.cjs --self-test
      - run: node ci/economy-v2-debt-cockpit-run.cjs ${{ matrix.profile }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e23-${{ matrix.profile }}-${{ matrix.seed }}
          path: economy-v2-e23-reports/
          if-no-files-found: warn
  cockpit:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: e23-reference-827381
          path: input/
      - run: node ci/economy-v2-cockpit-render.cjs input/audit-reference-827381.json economy-v2-e23-cockpit.html
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python tests/economy-v2-cockpit-chromium.py --html economy-v2-e23-cockpit.html --out economy-v2-e23-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e23-cockpit-browser-and-html
          path: |
            economy-v2-e23-cockpit.html
            economy-v2-e23-screenshots/
          if-no-files-found: warn
