name: Train de fusion
# Regroupe les PR étiquetées `train` (brouillons acceptés) et lance UNE batterie complète
# (tests.yml, Godot compris) sur main + le lot, puis fusionne tout en rebase (un commit par PR).
# Rouge : dichotomie sur la première moitié. Détail : docs/train-de-fusion.md.
# Déclenchement (19/11) : dès qu'une PR reçoit l'étiquette `train` (le code exécuté reste celui de main :
# pull_request_target ne lance pas le code de la PR), et toutes les 20 min en secours, à des minutes décalées
# (GitHub saute souvent les tâches planifiées à l'heure pile : une seule exécution planifiée la nuit du 18 au 19/11).
on:
  pull_request_target:
    types: [labeled]
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      taille_max:
        description: Nombre maximal de PR par lot
        type: string
        default: '6'
      essai:
        description: "Essai : construit le lot (conflits) sans rien pousser ni fusionner"
        type: boolean
        default: false

permissions:
  contents: write        # pousser la branche train/* et fusionner
  pull-requests: write   # créer la PR du train, commenter, fermer les PR d'origine
  issues: write          # étiquettes et tableau #591
  actions: write         # lancer tests.yml et la recette Windows RTX

jobs:
  train:
    if: github.repository == 'Xynph/cadrage-debordement' && (github.event_name != 'pull_request_target' || github.event.label.name == 'train')
    runs-on: ubuntu-24.04
    # Un seul train à la fois ; les déclenchements suivants attendent (au plus un en file). Au niveau du job : une
    # autre étiquette posée (train-echec…) donne une exécution sautée qui ne remplace pas le train en attente.
    concurrency:
      group: train-de-fusion
      cancel-in-progress: false
    # Attente de la batterie (≤ 100 min par lot) et jusqu'à 3 lots en dichotomie.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Vérifier le jeton du train
        env:
          TRAIN_TOKEN: ${{ secrets.TRAIN_TOKEN }}
        run: |
          if [ -z "$TRAIN_TOKEN" ]; then
            echo "::error::Secret TRAIN_TOKEN absent : voir docs/train-de-fusion.md (jeton personnel limité au dépôt)."
            echo "## ⛔ Train arrêté : secret TRAIN_TOKEN absent" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Faire passer le train
        env:
          # Jeton personnel (et non github.token) : les PR ouvertes par le jeton du dépôt voient leur CI
          # rester en « action_required » et GitHub refuse alors leur fusion (constaté le 19/11).
          GH_TOKEN: ${{ secrets.TRAIN_TOKEN }}
          TAILLE_MAX: ${{ inputs.taille_max || '6' }}
          ESSAI: ${{ inputs.essai || 'false' }}
        run: bash ci/train-de-fusion.sh
