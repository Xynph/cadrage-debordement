name: Economy V2 E2 shadow native 6x15
on:
  pull_request:
    branches:
      - research/economy-v2-e1-core-20261106
    paths:
      - 'dist/economy-v2-shadow.js'
      - 'tests/economy-v2-shadow.cjs'
      - 'ci/economy-v2-shadow-run.cjs'
      - '.github/workflows/economy-v2-shadow.yml'
  workflow_dispatch:
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [reference, modeste, alternatif]
        seed: [827381, 99173]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/economy-v2-shadow.js && node --check ci/economy-v2-shadow-run.cjs && node --test tests/economy-v2-shadow.cjs
      - run: node ci/economy-v2-shadow-run.cjs ${{ matrix.profile }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-${{ matrix.profile }}-${{ matrix.seed }}
          path: economy-v2-shadow-reports/
          if-no-files-found: warn
