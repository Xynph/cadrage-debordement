name: V124-V130 Interclubs Chromium dédié
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/index.html'
      - 'dist/interclub-world-v124-v130.js'
      - 'tests/interclub-world-v124-v130*'
      - '.github/workflows/interclub-world-v124-v130-chromium.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interclub-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Native tests and syntax
        run: |
          node --check dist/interclub-world-v124-v130.js
          node tests/interclub-world-v124-v130.cjs
          node tests/saves.cjs
          node tests/world-career.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Native career, world panels, persistence and legacy import
        run: python tests/interclub-world-v124-v130-chromium.py
