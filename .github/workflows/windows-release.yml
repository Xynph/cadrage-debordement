name: Windows — constructeur officiel et recette EXE
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # Recette automatique non bloquante de l'EXE à chaque fusion sur main.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: >-
          Brouillon de Release : SHA complet du main exact (lancer depuis main).
          Laisser vide pour une simple recette avec EXE téléchargeable, sur n'importe
          quelle branche (par exemple celle d'une PR).
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: windows-receipt-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  qualify-graphics:
    name: Préqualification graphique courte du véritable EXE
    if: >-
      github.event_name == 'pull_request' && github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'windows-graphics-smoke')
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Construire puis comparer les rendus courts sans créer de carrière
        shell: pwsh
        run: ./ci/run-windows-build.ps1 -SourceCommit $env:SOURCE_COMMIT -GraphicsSmoke
      - name: Conserver les diagnostics graphiques dans le journal gratuit
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'oval-windows-delivery'
          foreach ($relative in @('controller-unit.log','prepare.log','build.log','official-build/build/import.log','official-build/build/export.log','evidence/windows-report.json','evidence/angle-clean/loaded-modules.json','evidence/angle-clean/driver-ack.json','evidence/angle-clean/graphics-progress.json','evidence/angle-clean/process.json','evidence/angle-clean/report.json','evidence/angle-clean/stdout.log','evidence/angle-clean/stderr.log','evidence/mesa-native/loaded-modules.json','evidence/mesa-native/driver-ack.json','evidence/mesa-native/graphics-progress.json','evidence/mesa-native/process.json','evidence/mesa-native/report.json','evidence/mesa-native/stdout.log','evidence/mesa-native/stderr.log','evidence/mesa-local/loaded-modules.json','evidence/mesa-local/driver-ack.json','evidence/mesa-local/graphics-progress.json','evidence/mesa-local/process.json','evidence/mesa-local/report.json','evidence/mesa-local/stdout.log','evidence/mesa-local/stderr.log')) {
            $file = Join-Path $root $relative
            if (Test-Path -LiteralPath $file) { Write-Host "::group::$relative"; Get-Content -LiteralPath $file -Tail 100; Write-Host '::endgroup::' }
          }
          'Préqualification graphique seulement : aucune saison complète ni publication de ZIP revendiquée par ce job.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  qualify-pr:
    name: Qualification ciblée du véritable EXE
    if: >-
      github.event_name == 'pull_request' && github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'windows-receipt')
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Conserver les octets des sources
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Construire et recevoir le ZIP exact
        id: receipt
        shell: pwsh
        run: ./ci/run-windows-build.ps1 -SourceCommit $env:SOURCE_COMMIT
      - name: Journaux et verdict ciblé sans stockage Actions
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'oval-windows-delivery'
          foreach ($relative in @('controller-unit.log','prepare.log','build.log','official-build/build/import.log','official-build/build/export.log','evidence/windows-report.json','evidence/fresh/stdout.log','evidence/fresh/stderr.log','evidence/resume/stdout.log','evidence/resume/stderr.log')) {
            $file = Join-Path $root $relative
            if (Test-Path -LiteralPath $file) { Write-Host "::group::$relative"; Get-Content -LiteralPath $file -Tail 100; Write-Host '::endgroup::' }
          }
          "Recette ciblée de ``$env:SOURCE_COMMIT``. Aucun artefact/cache Actions, aucun paquet publié par ce job PR." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  recette:
    # Machines Windows gratuites du dépôt public. Hors de tests.yml : jamais requis par
    # la règle de main (seul « Validation CI » l'est), donc non bloquant pour les PR.
    name: Recette Windows EXE (non bloquante)
    if: >-
      github.event.repository.private == false && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.source_sha == ''))
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Conserver les octets des sources
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      # Constructeur officiel (outils épinglés et vérifiés), puis recette native de l'EXE
      # extrait du ZIP : démarrage sur profil vierge, création d'une carrière par l'interface,
      # matchs joués dans la vue 3D, sauvegarde, relance de l'EXE et reprise à l'identique.
      - name: Construire l'EXE et dérouler la recette automatique
        id: receipt
        shell: pwsh
        run: ./ci/run-windows-build.ps1 -SourceCommit $env:SOURCE_COMMIT
      - name: EXE téléchargeable (archive officielle)
        if: always() && steps.receipt.outputs.package != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RugbyLegacy27-Windows-x64-${{ github.sha }}
          path: ${{ steps.receipt.outputs.package }}
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
      - name: Preuves de recette (rapport, journaux, captures)
        if: always() && steps.receipt.outputs.evidence != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recette-windows-${{ github.sha }}
          path: |
            ${{ steps.receipt.outputs.root }}/*.log
            ${{ steps.receipt.outputs.root }}/official-build/build/*.log
            ${{ steps.receipt.outputs.evidence }}
            !${{ steps.receipt.outputs.evidence }}/private-user
          if-no-files-found: ignore
          retention-days: 14
      - name: Verdict de recette
        if: always()
        shell: pwsh
        env:
          OUTCOME: ${{ steps.receipt.outcome }}
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'oval-windows-delivery/evidence/windows-report.json'
          $lines = @("## Recette Windows EXE : $env:OUTCOME", '', "- Commit : ``$env:SOURCE_COMMIT``")
          if (Test-Path -LiteralPath $report) {
            $qa = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            $lines += "- Rapport : passed=$($qa.passed) ; échec : $($qa.failure)"
            foreach ($limit in @($qa.limits)) { if ($limit) { $lines += "- Limite : $limit" } }
          } else { $lines += '- Rapport de recette absent (construction interrompue).' }
          $lines += '- EXE : artefact « RugbyLegacy27-Windows-x64-<sha> » (ZIP officiel, 14 jours). Non bloquant : seul « Validation CI » est requis.'
          $lines -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  receive-main:
    name: Paquet main et preuves Windows en brouillon
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.source_sha != '' && github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ inputs.source_sha }}
      WORKFLOW_COMMIT: ${{ github.sha }}
    steps:
      - name: Verrouiller le commit main
        shell: pwsh
        run: |
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or $env:SOURCE_COMMIT -cne $env:WORKFLOW_COMMIT) { throw 'Le SHA fourni doit être le main exact de cette exécution.' }
          git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Construire et recevoir le ZIP exact
        id: receipt
        shell: pwsh
        run: ./ci/run-windows-build.ps1 -SourceCommit $env:SOURCE_COMMIT
      - name: Conserver les preuves en assets de Release brouillon
        if: always() && steps.receipt.outcome != 'skipped' && steps.receipt.outcome != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        run: |
          $arguments = @('--root',(Join-Path $env:RUNNER_TEMP 'oval-windows-delivery'),'--source-commit',$env:SOURCE_COMMIT,'--repo',$env:REPO,'--run-id',$env:RUN_ID,'--attempt',$env:RUN_ATTEMPT)
          if ($env:RECEIPT_OUTCOME -ne 'success') { $arguments += '--diagnostic' }
          python ci/publish-windows-release.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'La conservation des preuves a échoué.' }
      - name: Rappeler la validation finale requise
        if: always()
        shell: pwsh
        run: |
          'Brouillon seulement : publication finale après contrôle du gate, de la CI du main exact et des reçus Windows téléchargés. Aucun cache ni upload-artifact Actions utilisé.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
