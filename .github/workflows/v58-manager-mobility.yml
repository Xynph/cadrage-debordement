name: V58 mobilite native du manager
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/game.js'
      - 'dist/saves.js'
      - 'dist/manager-mobility.js'
      - 'dist/manager.js'
      - 'dist/world-career.js'
      - 'dist/coach-market.js'
      - 'dist/coach-opportunities.js'
      - 'tests/manager-mobility.cjs'
      - 'tests/saves.cjs'
      - 'tests/ci-selection.cjs'
      - 'tests/harness.cjs'
      - '.github/workflows/v58-manager-mobility.yml'
  push:
    branches: [main]
    paths:
      - 'dist/game.js'
      - 'dist/saves.js'
      - 'dist/manager-mobility.js'
      - 'dist/manager.js'
      - 'dist/world-career.js'
      - 'dist/coach-market.js'
      - 'dist/coach-opportunities.js'
      - 'tests/manager-mobility.cjs'
      - 'tests/saves.cjs'
      - 'tests/ci-selection.cjs'
      - 'tests/harness.cjs'
      - '.github/workflows/v58-manager-mobility.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: v58-mobility-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  native-mobility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verifier les raccordements definitifs
        run: |
          test ! -e ci/v58-apply.cjs
          test ! -e ci/v58-manager-mobility-test.txt
          node --check dist/manager-mobility.js
          node --check dist/game.js
          node --check dist/saves.js
      - name: Mobilite du manager dans les vraies carrieres
        env:
          CD_MOBILITY_REPORT: v58-mobility-report.json
        run: node tests/manager-mobility.cjs
      - name: Sauvegardes natives et couverture CI
        run: |
          node tests/saves.cjs
          node tests/ci-selection.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v58-native-mobility-report
          path: v58-mobility-report.json
          retention-days: 14
          if-no-files-found: error
