name: Economy V2 E2.9 integrity anchor and playability
on:
  pull_request:
    branches:
      - research/economy-v2-e28-sigkill-concurrency-20261106
    paths:
      - 'ci/economy-v2-e29-integrity.cjs'
      - 'tests/economy-v2-e29-integrity.cjs'
      - 'ci/economy-v2-e29-run.cjs'
      - '.github/workflows/economy-v2-e29.yml'
      - 'docs/economie-v2/e29-integrite-jouabilite.md'
  workflow_dispatch:
jobs:
  native-e29:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [reference, modeste, alternatif]
        seed: [827381, 99173]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ci/economy-v2-e29-integrity.cjs && node --check tests/economy-v2-e29-integrity.cjs && node --check ci/economy-v2-e29-run.cjs
      - run: node --test tests/economy-v2-e29-integrity.cjs tests/economy-v2-sigkill-concurrency.cjs tests/economy-v2-durable-store.cjs tests/economy-v2-atomic-adapter.cjs tests/economy-v2-due-contract.cjs tests/economy-v2-due-native.cjs tests/economy-v2-obligations.test.cjs tests/economy-v2-debt-audit.test.cjs tests/economy-v2-components.test.cjs tests/economy-v2-shadow.cjs tests/economy-v2-core.cjs
      - run: node ci/economy-v2-e29-run.cjs ${{ matrix.profile }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e29-${{ matrix.profile }}-${{ matrix.seed }}
          path: economy-v2-e29-reports/
          if-no-files-found: warn
