name: V58 observatoire natif des bancs
# Ménage CI du 12 novembre 2026 : déclenchement automatique retiré (suites Node déjà exécutées par tests.yml).
# Anciens déclencheurs : pull_request, workflow_dispatch. Relance manuelle : Actions > ce workflow > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: v58-observatory-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  observatory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests natifs V58
        run: |
          node --check dist/coach-opportunities.js
          node --check dist/world-career.js
          node tests/v58-native-coach-opportunities.cjs
          node tests/world-career.cjs
