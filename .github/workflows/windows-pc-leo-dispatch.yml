name: Déclencher la recette Windows RTX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  transmettre:
    name: Transmettre le SHA au dépôt privé
    if: >-
      github.repository == 'Xynph/cadrage-debordement' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.actor == 'Xynph' && github.triggering_actor == 'Xynph'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: recette-pc-leo
    steps:
      - name: Déclencher la recette privée
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.OVAL_RECETTE_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$DISPATCH_TOKEN" || ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Jeton de déclenchement absent ou SHA source invalide."
            exit 1
          fi
          payload=$(jq -cn --arg sha "$SOURCE_SHA" '{ref:"main",inputs:{source_sha:$sha}}')
          curl --silent --show-error --fail --output /dev/null --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            'https://api.github.com/repos/Xynph/oval-legacy-recette-windows/actions/workflows/recette-pc-leo.yml/dispatches'
          echo "Recette RTX demandée pour $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
