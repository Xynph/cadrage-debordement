name: Résultats CI des pull requests
on:
  workflow_run:
    workflows: ["Tests JavaScript"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publier ou actualiser le résultat sur la PR
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- cadrage-debordement-ci-status -->';
            let pulls = run.pull_requests || [];
            // GitHub peut omettre pull_requests dans certains événements workflow_run.
            if (!pulls.length && run.head_repository?.owner?.login && run.head_branch) {
              const { data: found } = await github.rest.pulls.list({
                owner, repo, state: 'open',
                head: run.head_repository.owner.login + ':' + run.head_branch,
                per_page: 100
              });
              pulls = found;
            }
            if (!pulls.length) {
              core.notice('Aucune PR ouverte associée au workflow terminé.');
              return;
            }
            const state = run.conclusion === 'success' ? '✅ Réussie' : '❌ ' + (run.conclusion || 'Inconnue');
            const body = [
              marker,
              '### Résultat CI automatique',
              '',
              '**Tests JavaScript : ' + state + '**',
              '',
              'Exécution : [#' + run.run_number + '](' + run.html_url + ')',
              'Commit testé : `' + run.head_sha.slice(0, 12) + '`',
              '',
              'Ce message est actualisé à chaque fin de CI pour éviter les doublons.'
            ].join('\n');
            for (const pull of pulls) {
              // Vérification en temps réel, pas seulement les informations de l'événement.
              const { data: current } = await github.rest.pulls.get({
                owner, repo, pull_number: pull.number
              });
              if (current.state !== 'open' || current.head.sha !== run.head_sha) {
                core.notice('PR #' + pull.number + ' : fermée ou exécution obsolète, ignorée.');
                continue;
              }
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pull.number, per_page: 100
              });
              const previous = comments.find(c =>
                c.user?.type === 'Bot' && c.body?.includes(marker)
              );
              if (previous) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: previous.id, body
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pull.number, body
                });
              }
              core.info('Résultat CI publié sur PR #' + pull.number);
            }
