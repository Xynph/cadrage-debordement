name: Reception Chromium observatoire tactique
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/match-tactical-visual.js'
      - 'dist/match-cockpit.js'
      - 'dist/index.html'
      - 'tests/match-tactical-browser.py'
      - '.github/workflows/match-tactical-chromium.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verifier le cockpit natif et l'observatoire dans Chromium
        run: |
          (cd dist && python -m http.server 8765 --bind 127.0.0.1) &
          python tests/match-tactical-browser.py
      - name: Conserver la preuve
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tactical-browser-report
          path: tactical-browser-report/
          if-no-files-found: warn
          retention-days: 14
