name: V101-V116 Raccord PC Chromium
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/index.html'
      - 'dist/espoirs-coaching-v101-v104.js'
      - 'dist/sporting-director-v105-v110.js'
      - 'dist/fan-experience-v111-v116.js'
      - 'dist/v101-v116-ui-bridge.js'
      - 'tests/v101-v116-*'
      - '.github/workflows/v101-v116-chromium.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reception-v101-v116:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/v101-v116-combined.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/v101-v116-chromium.py
