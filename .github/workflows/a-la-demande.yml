name: Tests en ligne à la demande
# Quand le PC de Léo est indisponible : suites, captures et mesures Godot se lancent ici (runner
# ubuntu standard, gratuit pour un dépôt public, aucun secret) via `bash ci/en-ligne.sh`.
# workflow_dispatch n'existe que sur la branche par défaut : utilisable après fusion dans main.
#
# Déclencheur de secours (quand le dispatch par l'API est refusé) : un push sur une branche
# `en-ligne/**` ; les paramètres sont lus dans ci/en-ligne.json (ref, suites, captures, mesures)
# et le code testé est celui de la branche poussée. ci/en-ligne.sh s'en charge.
#
# Résultats : publiés par git (job « publier ») dans la branche orpheline `resultats-en-ligne`,
# sous runs/<run_id>/, lisibles depuis la session Claude (artefacts et stockage bloqués par le proxy) ;
# l'artefact reste disponible 7 jours pour Léo. La branche de repli en-ligne/<horodatage> est supprimée
# par le workflow ; l'entrée `menage` supprime les branches en-ligne/* et tmp/* de plus d'un jour.
run-name: "En ligne ${{ inputs.cle || github.ref_name }}"
on:
  push:
    branches: ['en-ligne/**']
  workflow_dispatch:
    inputs:
      cle:
        description: 'Identifiant unique posé par ci/en-ligne.sh pour retrouver ce run (évite les courses entre agents)'
        type: string
        required: false
        default: ''
      ref:
        description: 'Branche à tester'
        type: string
        required: false
        default: main
      suites:
        description: 'Suites tests/*.cjs séparées par des espaces (godot-xxx accepté sans chemin) ; vide = aucune'
        type: string
        required: false
        default: ''
      captures:
        description: 'Captures PNG des écrans principaux (carrière Monde, rendu sous xvfb)'
        type: boolean
        required: false
        default: false
      captures_quoi:
        description: 'Captures voulues, séparées par des virgules : intro, finitions, fiche-club, feuille-espoir, match-rendu (hors défaut), comparateur, audio ; vide = intro, finitions, fiche-club, feuille-espoir'
        type: string
        required: false
        default: ''
      mesures:
        description: "Temps d'ouverture des écrans et portraits progressifs"
        type: boolean
        required: false
        default: false
      menage:
        description: 'Ménage seul : supprime les branches distantes en-ligne/* et tmp/* de plus d un jour (aucun test)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Une relance sur la même branche remplace l'exécution précédente.
concurrency:
  group: a-la-demande-${{ inputs.menage && 'menage' || inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  en-ligne:
    if: ${{ !inputs.menage }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX || '"ubuntu-24.04"') }}
    timeout-minutes: 90
    env:
      CD_EL_SUITES: ${{ inputs.suites }}
      CD_EL_CAPTURES: ${{ inputs.captures }}
      CD_EL_CAPTURES_QUOI: ${{ inputs.captures_quoi }}
      CD_EL_MESURES: ${{ inputs.mesures }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.ref }}
          persist-credentials: false
      - name: Outils en ligne (ceux de la branche testée s'ils existent, sinon ceux de main)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 "https://github.com/${{ github.repository }}.git" main
          [[ -f ci/en-ligne-run.sh ]] || git show FETCH_HEAD:ci/en-ligne-run.sh > ci/en-ligne-run.sh
      - name: Lire les paramètres (push de secours)
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const c = JSON.parse(require("fs").readFileSync("ci/en-ligne.json", "utf8"));
            const out = [
              "CD_EL_SUITES=" + String(c.suites || "").replace(/[^A-Za-z0-9._ \/-]/g, ""),
              "CD_EL_CAPTURES=" + (c.captures === true),
              "CD_EL_CAPTURES_QUOI=" + String(c.captures_quoi || "").replace(/[^a-z, -]/g, ""),
              "CD_EL_MESURES=" + (c.mesures === true)
            ].join("\n") + "\n";
            require("fs").appendFileSync(process.env.GITHUB_ENV, out);
          '
      - name: Vérifier qu'un travail est demandé
        shell: bash
        run: |
          if [[ -z "${CD_EL_SUITES// /}" && "$CD_EL_CAPTURES" != "true" && "$CD_EL_MESURES" != "true" ]]; then
            echo "::error::Rien à faire : renseigner suites, captures ou mesures."; exit 1
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Préparer le rendu logiciel gratuit sous X11
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --fix-missing --no-install-recommends xvfb libgl1-mesa-dri
      - name: Cache de l'archive du SDK Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/cd-godot-sdk
          key: godot-sdk-${{ hashFiles('ci/godot-sdk.json') }}
      - name: Installer le SDK officiel épinglé et vérifier son archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, urllib.request, zipfile
          config = json.loads(pathlib.Path('ci/godot-sdk.json').read_text())
          tools = pathlib.Path(os.environ['RUNNER_TEMP']) / 'godot-sdk'
          tools.mkdir()
          archive = tools / 'godot.zip'
          cached = pathlib.Path.home() / '.cache' / 'cd-godot-sdk' / 'godot.zip'
          if cached.is_file() and cached.stat().st_size == config['bytes'] and hashlib.sha256(cached.read_bytes()).hexdigest() == config['sha256']:
              shutil.copyfile(cached, archive)
              print('SDK Godot : archive restaurée du cache')
          else:
              urllib.request.urlretrieve(config['url'], archive)
              cached.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(archive, cached)
          assert archive.stat().st_size == config['bytes'], 'Unexpected SDK archive size'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == config['sha256'], 'SDK checksum mismatch'
          with zipfile.ZipFile(archive) as z:
              assert z.namelist() == [config['executable']], 'Unexpected SDK archive member'
              z.extractall(tools)
          executable = tools / config['executable']
          executable.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CD_GODOT_EXECUTABLE=' + str(executable) + '\n')
              env.write('CD_GODOT_EXE=' + str(executable) + '\n')
          PY
      - name: Préparer et importer le vrai projet
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-godot-prototype.py --stage-only --node "$(command -v node)"
          timeout --kill-after=10s 180s "$CD_GODOT_EXECUTABLE" --headless --audio-driver Dummy --path native/godot --import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/godot-import.log"; then
            exit 1
          fi
      - name: Exécuter suites, captures et mesures demandées
        id: executer
        shell: bash
        # Plus court que le job : si une phase se bloque, l'étape suivante (always) reste exécutée.
        timeout-minutes: 80
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          xvfb-run -a -s '-screen 0 1920x1080x24' bash ci/en-ligne-run.sh "$RUNNER_TEMP/resultats"
          code=$?
          [[ -f "$RUNNER_TEMP/resultats/resume.md" ]] && cat "$RUNNER_TEMP/resultats/resume.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Afficher résumé, échecs et fin des journaux dans le journal du job
        if: ${{ always() }}
        shell: bash
        run: |
          r="$RUNNER_TEMP/resultats"
          echo "::group::resume.md"; cat "$r/resume.md" 2>/dev/null || echo "(absent)"; echo "::endgroup::"
          echo "::group::echecs.txt"; cat "$r/echecs.txt" 2>/dev/null || echo "(aucun échec relevé)"; echo "::endgroup::"
          if [[ -s "$r/journaux-echec.txt" ]]; then
            while read -r j; do echo "::group::fin de $j (80 dernières lignes)"; tail -n 80 "$r/$j"; echo "::endgroup::"; done < "$r/journaux-echec.txt"
          fi
          if [[ "${{ steps.executer.outcome }}" != success ]]; then
            dernier="$(ls -t "$r"/*.log 2>/dev/null | head -1)"
            [[ -n "$dernier" ]] && { echo "::group::dernier journal écrit : $(basename "$dernier")"; tail -n 80 "$dernier"; echo "::endgroup::"; }
          fi
      - name: Conserver les résultats en artefact (7 jours)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultats-en-ligne
          path: ${{ runner.temp }}/resultats
          retention-days: 7
          if-no-files-found: ignore

  # Publication par git : seul job (avec « menage ») à écrire dans le dépôt ; aucun code de la branche
  # testée n'y est exécuté (pas de checkout), le script vient de main.
  publier:
    needs: en-ligne
    if: ${{ always() && !inputs.menage && needs.en-ligne.result != 'skipped' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: resultats-en-ligne-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Récupérer les résultats
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: resultats-en-ligne
          path: ${{ runner.temp }}/resultats
      - name: Publier dans la branche resultats-en-ligne
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet pillow || sudo apt-get -o Acquire::Retries=5 install -y --fix-missing --no-install-recommends imagemagick
          mkdir "$RUNNER_TEMP/outil" && cd "$RUNNER_TEMP/outil" && git init -q
          git fetch -q --no-tags --depth=1 "https://github.com/${{ github.repository }}.git" main
          git show FETCH_HEAD:ci/en-ligne-publier.sh > "$RUNNER_TEMP/en-ligne-publier.sh"
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$b64"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $b64"
          cd "$RUNNER_TEMP"
          bash en-ligne-publier.sh "$RUNNER_TEMP/resultats" "${{ github.run_id }}" "https://github.com/${{ github.repository }}.git"
      - name: Supprimer la branche de repli qui a déclenché le run
        if: ${{ always() && github.event_name == 'push' }}
        shell: bash
        env:
          BRANCHE: ${{ github.ref_name }}
        run: |
          # Seul le préfixe en-ligne/ est concerné.
          [[ "$BRANCHE" =~ ^en-ligne/[A-Za-z0-9._-]+$ ]] || { echo "Branche $BRANCHE hors préfixe en-ligne/ : rien supprimé."; exit 0; }
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCHE" && echo "Branche $BRANCHE supprimée."

  menage:
    if: ${{ inputs.menage }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Supprimer les branches en-ligne/* et tmp/* de plus d'un jour
        shell: bash
        run: |
          set -uo pipefail
          repo="${{ github.repository }}"; limite=$(( $(date +%s) - 86400 )); n=0
          for prefixe in en-ligne tmp; do
            while IFS=' ' read -r ref sha; do
              # Garde-fou : seuls les préfixes en-ligne/ et tmp/ sont supprimés.
              [[ "$ref" =~ ^refs/heads/(en-ligne|tmp)/[A-Za-z0-9._/-]+$ ]] || continue
              date="$(gh api "repos/$repo/commits/$sha" --jq '.commit.committer.date' 2>/dev/null || true)"
              [[ -n "$date" ]] || continue
              [[ "$(date -d "$date" +%s)" -lt $limite ]] || { echo "Gardée (récente) : ${ref#refs/heads/}"; continue; }
              if gh api -X DELETE "repos/$repo/git/${ref}" >/dev/null 2>&1; then
                echo "Supprimée : ${ref#refs/heads/}"; n=$((n+1))
              else
                echo "Suppression refusée : ${ref#refs/heads/}"
              fi
            done < <(gh api --paginate "repos/$repo/git/matching-refs/heads/$prefixe/" --jq '.[] | "\(.ref) \(.object.sha)"')
          done
          echo "## Ménage des branches : $n supprimée(s)" >> "$GITHUB_STEP_SUMMARY"
