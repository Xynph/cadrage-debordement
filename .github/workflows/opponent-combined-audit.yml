name: Reception IA combinee - 24 graines et V16
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/opponent-combined-audit.yml'
      - 'docs/opponent-combined-audit.md'
permissions:
  contents: read
jobs:
  combined-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Prove FAIL 07 against current main engine
        run: |
          mkdir -p opponent-combined-proof
          set +e
          node tests/champion-budget-regression.cjs > opponent-combined-proof/main-regression.log 2>&1
          echo $? > opponent-combined-proof/main-regression.exit
          set -e
          grep 'FAIL 07\|PASS 07\|CHAMPION BUDGET REGRESSION' opponent-combined-proof/main-regression.log || true
      - name: Overlay exactly PR 216 rugby implementation
        run: |
          git fetch --no-tags --depth=1 origin b80df6bf4e6fec0df63c27254f18ec6604c4aab4
          git show b80df6bf4e6fec0df63c27254f18ec6604c4aab4:dist/rugby.js > dist/rugby.js
          git show b80df6bf4e6fec0df63c27254f18ec6604c4aab4:tests/opponent-defensive-scout.cjs > tests/opponent-defensive-scout.cjs
          git diff --name-only > opponent-combined-proof/overlay-paths.txt
          node tests/opponent-tactical-ai.cjs
          node tests/opponent-defensive-scout.cjs
      - name: Prove FAIL 07 on combined engine
        run: |
          set +e
          node tests/champion-budget-regression.cjs > opponent-combined-proof/combined-regression.log 2>&1
          echo $? > opponent-combined-proof/combined-regression.exit
          set -e
          grep 'FAIL 07\|PASS 07\|CHAMPION BUDGET REGRESSION' opponent-combined-proof/combined-regression.log || true
          python - <<'PY'
          from pathlib import Path
          p=Path('opponent-combined-proof')
          main=(p/'main-regression.log').read_text()
          combined=(p/'combined-regression.log').read_text()
          print('main failure 07:', 'FAIL 07' in main)
          print('combined failure 07:', 'FAIL 07' in combined)
          if ('FAIL 07' in main)!=('FAIL 07' in combined):
              raise SystemExit('FAIL 07 differs between main and combined; diagnose before modifying economics')
          PY
      - name: 24 seeds x control/adapted on combined native engine plus genuine historical V16 import
        run: |
          (cd dist && python -m http.server 8765 --bind 127.0.0.1) &
          python tests/opponent-native-browser.py > opponent-combined-proof/native.log 2>&1 || { cat opponent-combined-proof/native.log; exit 1; }
          cp opponent-native-audit/report.json opponent-combined-proof/native-report.json
          python - <<'PY'
          import json
          r=json.load(open('opponent-combined-proof/native-report.json'))
          assert r['runs']==48 and r['completed']==48
          assert r['historicalV16']['passed'] is True
          assert len(r['paired'])==24
          print('PASS: 24 paired seeds / 48 native matches, historical V16 import')
          PY
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: combined-opponent-native-proof
          path: opponent-combined-proof/
          retention-days: 14
