name: Assistant composition MATCHDAY-02 - Chromium
# Validation PR regroupée dans .github/workflows/matchday-browser.yml.
# Exécution individuelle toujours disponible manuellement pour diagnostic.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matchday02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Vérifier les compositions dans le vrai jeu
        run: python tests/matchday-lineup-browser.py
