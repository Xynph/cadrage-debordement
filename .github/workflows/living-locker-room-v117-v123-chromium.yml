name: V117-V123 Vestiaire Chromium dédié
# Ménage CI du 12 novembre 2026 : déclenchement automatique retiré (réception Chromium de la version web historique ; tests Node repris par tests.yml, interface web partagée couverte par ui-browser-consolidated.yml).
# Anciens déclencheurs : pull_request, workflow_dispatch. Relance manuelle : Actions > ce workflow > Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vestiaire-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Unit tests and syntax
        run: |
          node --check dist/living-locker-room-v117-v123.js
          node tests/living-locker-room-v117-v123.cjs
          node tests/saves.cjs
          node tests/v64-vestiaire.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Native click and JSON save reception
        run: python tests/living-locker-room-v117-v123-chromium.py
