name: Rugby Reel - ten-season native career QA
on:
  push:
    branches: [qa/rugby-real-long-career-20261107]
    paths:
      - 'tests/rugby-real-long-career-qa.cjs'
      - '.github/workflows/rugby-real-long-career-qa.yml'
      - 'docs/rugby-real-long-career-qa-20261107.md'
  pull_request:
    paths:
      - 'tests/rugby-real-long-career-qa.cjs'
      - '.github/workflows/rugby-real-long-career-qa.yml'
      - 'docs/rugby-real-long-career-qa-20261107.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ten-seasons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax and complete native career acceptance
        run: |
          node --check tests/rugby-real-long-career-qa.cjs
          node --test tests/rugby-real-long-career-qa.cjs
      - name: Verify master remains tracked and unchanged
        run: |
          git diff --exit-code -- modding/data06/rugby-master-2026-2027.json dist/lnr-career.js dist/development.js dist/saves.js
