name: Diagnostic economique natif
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/academy-planning.js'
      - 'dist/ai-roster-cycle.js'
      - 'dist/board-planning.js'
      - 'dist/career-history.js'
      - 'dist/career-integration.js'
      - 'dist/club-ai.js'
      - 'dist/coach-market.js'
      - 'dist/coach-opportunities.js'
      - 'dist/development.js'
      - 'dist/economy.js'
      - 'dist/facilities.js'
      - 'dist/finance-planning.js'
      - 'dist/financial-recovery.js'
      - 'dist/frontrow.js'
      - 'dist/game.js'
      - 'dist/manager-mobility.js'
      - 'dist/manager.js'
      - 'dist/match-actions.js'
      - 'dist/match-preparation.js'
      - 'dist/matchflow.js'
      - 'dist/reputation.js'
      - 'dist/rugby-world.js'
      - 'dist/rugby.js'
      - 'dist/saves.js'
      - 'dist/storage.js'
      - 'dist/transfer-planning.js'
      - 'dist/v39.js'
      - 'dist/world-*.js'
      - 'tests/harness.cjs'
      - 'tests/economy-audit.cjs'
      - 'tests/champion-budget-regression.cjs'
      - 'tests/economy-audit/**'
      - 'ci/economy-audit.cjs'
      - 'tests/career-resilience/native.cjs'
      - '.github/workflows/economy-audit.yml'
  push:
    branches: [main]
    paths:
      - 'dist/academy-planning.js'
      - 'dist/ai-roster-cycle.js'
      - 'dist/board-planning.js'
      - 'dist/career-history.js'
      - 'dist/career-integration.js'
      - 'dist/club-ai.js'
      - 'dist/coach-market.js'
      - 'dist/coach-opportunities.js'
      - 'dist/development.js'
      - 'dist/economy.js'
      - 'dist/facilities.js'
      - 'dist/finance-planning.js'
      - 'dist/financial-recovery.js'
      - 'dist/frontrow.js'
      - 'dist/game.js'
      - 'dist/manager-mobility.js'
      - 'dist/manager.js'
      - 'dist/match-actions.js'
      - 'dist/match-preparation.js'
      - 'dist/matchflow.js'
      - 'dist/reputation.js'
      - 'dist/rugby-world.js'
      - 'dist/rugby.js'
      - 'dist/saves.js'
      - 'dist/storage.js'
      - 'dist/transfer-planning.js'
      - 'dist/v39.js'
      - 'dist/world-*.js'
      - 'tests/harness.cjs'
      - 'tests/economy-audit.cjs'
      - 'tests/champion-budget-regression.cjs'
      - 'tests/economy-audit/**'
      - 'ci/economy-audit.cjs'
      - 'tests/career-resilience/native.cjs'
      - '.github/workflows/economy-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: native-economy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Annuler les anciennes revisions de PR ; ne jamais annuler les validations de main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  transactions:
    name: Transactions natives et reproductions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Cas limites sans modification du moteur
        env:
          CD_ECONOMY_TEST_REPORT: economy-transactions.json
          CD_CHAMPION_BUDGET_REPORT: champion-budget-regression.json
        run: |
          node --check tests/economy-audit/native.cjs
          node --check ci/economy-audit.cjs
          node tests/economy-audit.cjs
          node tests/champion-budget-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economy-transactions
          path: |
            economy-transactions.json
            champion-budget-regression.json
          if-no-files-found: error
          retention-days: 14
  campaigns:
    name: '${{ matrix.profile }} - graine ${{ matrix.seed }} - 15 saisons'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        profile: [reference, modeste, deficitFormation]
        seed: [827381, 99173]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Quinze saisons du vrai moteur et rapprochement de tous les clubs
        run: node ci/economy-audit.cjs '${{ matrix.profile }}' '${{ matrix.seed }}' 15 economy-audit-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'economy-campaign-${{ matrix.profile }}-${{ matrix.seed }}'
          path: economy-audit-report/
          if-no-files-found: error
          retention-days: 14
  summary:
    name: Validation du diagnostic economique
    if: always()
    needs: [transactions, campaigns]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Refuser les echecs et les campagnes incompletes
        env:
          TRANSACTIONS: ${{ needs.transactions.result }}
          CAMPAIGNS: ${{ needs.campaigns.result }}
        run: test "$TRANSACTIONS" = success && test "$CAMPAIGNS" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: economy-campaign-*
          path: economy-audit-input
          merge-multiple: true
      - run: |
          node ci/economy-audit.cjs --aggregate economy-audit-input
          cat economy-audit-summary/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: economy-audit-summary
          path: economy-audit-summary/
          if-no-files-found: error
          retention-days: 14
