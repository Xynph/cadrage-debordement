name: IA adverse - audit 24 matchs natifs
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/tactical-plans.js'
      - 'tests/opponent-native-browser.py'
      - '.github/workflows/opponent-native-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: |
          (cd dist && python -m http.server 8765 --bind 127.0.0.1) &
          python tests/opponent-native-browser.py
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opponent-native-audit
          path: opponent-native-audit/
          retention-days: 14
